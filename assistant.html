<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lodwick Masete Portfolio Assistant Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            background: #0066ff;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .bot-icon {
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0066ff;
            font-weight: bold;
        }

        .control-icons {
            display: flex;
            gap: 10px;
        }

        .control-icon {
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .control-icon:hover {
            opacity: 1;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-options {
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid #eaeaea;
            transition: opacity 0.3s;
        }

        .chat-options.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .option-button {
            padding: 8px 15px;
            background: #f0f7ff;
            border: 1px solid #d0e3ff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            color: #0066ff;
        }

        .option-button:hover {
            background: #e0edff;
            border-color: #0066ff;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eaeaea;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #d0d0d0;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .chat-input input:focus {
            border-color: #0066ff;
        }

        .send-button {
            width: 40px;
            height: 40px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 50%;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .send-button:hover {
            background: #0055dd;
        }

        .send-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .bot-message {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .user-message {
            background: #0066ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .chat-bubble {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #0066ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
            z-index: 999;
            transition: all 0.3s ease;
        }

        .typing-indicator {
            display: flex;
            padding: 12px 15px;
            background: #f0f0f0;
            border-radius: 18px;
            align-self: flex-start;
            margin-top: 5px;
            border-bottom-left-radius: 5px;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            float: left;
            margin: 0 1px;
            background-color: #9E9EA1;
            display: block;
            border-radius: 50%;
            opacity: 0.4;
        }

        .typing-indicator span:nth-of-type(1) {
            animation: 1s blink infinite 0.3333s;
        }

        .typing-indicator span:nth-of-type(2) {
            animation: 1s blink infinite 0.6666s;
        }

        .typing-indicator span:nth-of-type(3) {
            animation: 1s blink infinite 0.9999s;
        }

        @keyframes blink {
            50% {
                opacity: 1;
            }
        }

        /* Link styling */
        .message a {
            color: #0066ff;
            text-decoration: none;
            font-weight: 500;
        }

        .message a:hover {
            text-decoration: underline;
        }

        /* Code block styling */
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            margin: 10px 0;
            overflow-x: auto;
            position: relative;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 5px 10px;
            border-radius: 6px 6px 0 0;
            color: #ccc;
            font-size: 12px;
        }

        .copy-btn {
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #0055dd;
        }

        .copy-btn.copied {
            background: #4CAF50;
        }

        .code-block {
            position: relative;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .message {
                max-width: 90%;
            }
        }
    </style>

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const chatBubble = document.getElementById('chat-bubble');
        const chatBody = document.getElementById('chat-body');
        const chatOptions = document.getElementById('chat-options');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const minimizeBtn = document.getElementById('minimize-btn');
        const chatHeader = document.getElementById('chat-header');

        // State
        let isChatOpen = false;
        let isTyping = false;

        // Functions
        function toggleChat() {
            if (isChatOpen) {
                chatContainer.style.display = 'none';
                chatBubble.style.display = 'flex';
            } else {
                chatContainer.style.display = 'flex';
                chatBubble.style.display = 'none';
                if (chatBody.children.length === 0) {
                    // First time opening, show welcome message
                    setTimeout(() => {
                        addBotMessage(chatbotData.welcome);
                        showOptions(chatbotData.initialOptions);
                    }, 500);
                }
            }
            isChatOpen = !isChatOpen;
        }

        function addBotMessage(text) {
            isTyping = true;
            disableOptions();

            // Add typing indicator
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.innerHTML = '<span></span><span></span><span></span>';
            chatBody.appendChild(typingIndicator);

            // Scroll to bottom
            chatBody.scrollTop = chatBody.scrollHeight;

            // After a short delay, remove typing indicator and add the actual message
            setTimeout(() => {
                chatBody.removeChild(typingIndicator);

                const messageElement = document.createElement('div');
                messageElement.className = 'message bot-message';

                // Process text for links and code blocks
                const processedText = processMessageText(text);
                messageElement.innerHTML = processedText;

                chatBody.appendChild(messageElement);

                // Add copy functionality to code blocks
                addCopyButtons();

                // Scroll to the new message
                chatBody.scrollTop = chatBody.scrollHeight;

                isTyping = false;
                enableOptions();
            }, 1000 + Math.random() * 1000); // Random delay for more natural feel
        }
function escapeHtml(html) {
    return html
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function processMessageText(text) {
    // Process code blocks
    text = text.replace(/```(\w*)\n([\s\S]*?)\n```/g, function(match, lang, code) {
        const escapedCode = escapeHtml(code);
        return `<div class="code-block">
                    <div class="code-header">${lang}<button class="copy-btn">Copy</button></div>
                    <pre><code>${escapedCode}</code></pre>
                </div>`;
    });

    // Process links
    text = text.replace(/([^]+)([^)]+)/g, 
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

    // Process line breaks
    text = text.replace(/\n/g, '<br>');

    return text;
}

        function addCopyButtons() {
            document.querySelectorAll('.copy-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const codeBlock = e.target.closest('.code-block');
                    const code = codeBlock.querySelector('code').textContent;

                    navigator.clipboard.writeText(code).then(() => {
                        button.textContent = 'Copied!';
                        button.classList.add('copied');

                        setTimeout(() => {
                            button.textContent = 'Copy';
                            button.classList.remove('copied');
                        }, 2000);
                    });
                });
            });
        }

        function addUserMessage(text) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message user-message';
            messageElement.textContent = text;
            chatBody.appendChild(messageElement);

            // Scroll to the new message
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showOptions(options) {
            // Clear previous options
            chatOptions.innerHTML = '';

            // Add new options
            options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = option;
                button.addEventListener('click', () => handleOptionClick(option));
                chatOptions.appendChild(button);
            });
        }

        function disableOptions() {
       //     chatOptions.style.display ='none';
            chatOptions.classList.add('disabled');
            sendBtn.disabled = true;
        }

        function enableOptions() {
           // chatOptions.style.display ='';
            chatOptions.classList.remove('disabled');
            sendBtn.disabled = false;
            //chatBody.scrollTop = chatBody.scrollHeight;
        }

        function handleOptionClick(option) {
            if (isTyping) return;

            // Add the selected option as a user message
            addUserMessage(option);

            // Process the response
            processUserInput(option);
        }

        function processUserInput(text) {
            disableOptions();

            // Check if we have a predefined response
            if (chatbotData.responses[text]) {
                const response = chatbotData.responses[text];

                // Add bot response after a short delay
                setTimeout(() => {
                    addBotMessage(response.text);

                    // Show options if available
                    if (response.options) {
                        showOptions(response.options);
                    } else {
                        showOptions(chatbotData.initialOptions);
                    }
                }, 500);
            } else {
                // Fallback response for non-predefined inputs
                setTimeout(() => {
                    addBotMessage(chatbotData.fallback);
                    showOptions(chatbotData.initialOptions);
                }, 500);
            }
        }

        function handleUserInputSubmit() {
            const text = userInput.value.trim();
            if (text && !isTyping) {
                // Add user message
                addUserMessage(text);

                // Process the input
                processUserInput(text);

                // Clear input field
                userInput.value = '';
            }
        }

        // Event Listeners
        chatBubble.addEventListener('click', toggleChat);
        minimizeBtn.addEventListener('click', toggleChat);
        chatHeader.addEventListener('click', (e) => {
            // Only toggle if directly clicking the header (not its child elements)
            if (e.target === chatHeader || e.target.classList.contains('chat-header-title') || e.target.tagName === 'H3') {
                toggleChat();
            }
        });

        sendBtn.addEventListener('click', handleUserInputSubmit);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleUserInputSubmit();
            }
        });

        // Initialize chat with welcome message if opened directly
        if (window.location.hash === '#chat') {
            toggleChat();
        }
    </script>
